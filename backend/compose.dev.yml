name: gamw-residuos-dev

services:
  db:
    image: postgis/postgis:16-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gamw_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/20-gamw-app-role.sh:/docker-entrypoint-initdb.d/20-gamw-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gamw_app_dev -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  gamw_postgres_data:
