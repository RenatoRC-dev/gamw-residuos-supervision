spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gamw-residuos
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # INT-04: identidad de MIGRACIÓN separable de la de ejecución mediante SPRING_FLYWAY_USER y SPRING_FLYWAY_PASSWORD
    # (Flyway abre entonces su propia conexión con ese rol propietario; DB_USERNAME queda como rol de ejecución no propietario).
    # Sin esas variables se conserva el comportamiento anterior (misma conexión). No se fijan aquí para no forzar un valor vacío.
    # Para aplicar las concesiones de mínimo privilegio: GAMW_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/privilegios
    # y GAMW_ROL_EJECUCION=<rol de ejecución>. Si se incluye db/privilegios sin un rol válido, la migración FALLA.
    locations: ${GAMW_FLYWAY_LOCATIONS:classpath:db/migration}
    placeholders:
      rol_ejecucion: ${GAMW_ROL_EJECUCION:}
    clean-disabled: true
    validate-on-migrate: true
  mvc:
    problemdetails:
      enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
gamw:
  seguridad:
    jwt:
      secreto: ${GAMW_JWT_SECRET:}
      duracion: ${GAMW_JWT_DURATION:PT30M}
      emisor: ${GAMW_JWT_ISSUER:gamw-residuos}
