name: Android emulator QA (on demand)

# QA automatizada en EMULADOR, solo bajo demanda: no afecta al CI estándar (verify.yml).
# NO sustituye la QA física: GPS nativo real, batería, segundo plano y restricciones de fabricantes siguen PENDING.
# Backend y PostgreSQL/PostGIS son efímeros y propios de la prueba; solo datos y credenciales sintéticas.
on:
  workflow_dispatch:
  # Disparo acotado: solo la rama de trabajo actual y solo si cambia la QA Android o su workflow. El workflow aún no existe en la rama
  # por defecto, por lo que workflow_dispatch no puede usarse hasta entonces. No implica merge a main.
  push:
    branches:
      - feat/gamw-checkpoint-fiscalizacion-20261109
    paths:
      - .github/workflows/android-emulator-qa.yml
      - .github/scripts/android_emulador_qa.sh
      - apps/mobile/qa_emulador/**
      - apps/mobile/analysis_options.yaml
      # El código nativo Kotlin (permisos y servicio GPS) solo se compila aquí: un cambio en él debe ejecutar esta QA.
      - apps/mobile/android/app/src/main/**
      - apps/mobile/lib/modules/ejecucion/gps/**
      - backend/src/test/java/bo/gob/warnes/gamw/residuos/modules/ejecucion/jornadas/api/AndroidEmuladorQaIT.java

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven Wrapper (descarga verificada por SHA-256, con reintentos)
        working-directory: backend
        run: |
          for i in 1 2 3 4 5; do
            sh ./mvnw --batch-mode -v && exit 0
            echo "Descarga de Maven falló (intento $i); reintentando"; sleep $((i * 20))
          done
          exit 1
      - name: PostgreSQL 16 y PostGIS (solo binarios; el clúster lo crea la prueba)
        run: |
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends postgresql-16 postgresql-16-postgis-3; then
              sudo systemctl stop postgresql || true; exit 0
            fi
            echo "Instalación apt falló (intento $i); reintentando"; sleep $((i * 30))
          done
          echo "::error title=Infraestructura apt no disponible::No se pudieron instalar postgresql-16/postgis tras 3 intentos (no es un fallo de la aplicación)."
          exit 1
      - name: Resolver plugins y dependencias Maven (reintentos acotados)
        working-directory: backend
        run: |
          for i in 1 2 3; do
            sh ./mvnw --batch-mode --no-transfer-progress dependency:resolve-plugins dependency:resolve && exit 0
            echo "Resolución Maven falló (intento $i); reintentando"; sleep $((i * 30))
          done
          echo "::error title=Repositorio Maven no disponible::No se resolvieron dependencias tras 3 intentos (infraestructura)."
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Dependencias móviles
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Análisis estático de todo el proyecto móvil (incluye qa_emulador/, sin exclusiones)
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Compilar APK de depuración (código nativo Kotlin) con reintentos ante fallos transitorios de Gradle
        working-directory: apps/mobile
        # Run 44537269459: Gradle no pudo resolver dependencias Kotlin 2.0.21 (artefactos existentes en Maven Central) de forma transitoria.
        # Esta compilación verifica MainActivity/ServicioCapturaGps y precarga la caché de Gradle; la QA del emulador sigue completa.
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          for i in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "Compilación Android falló (intento $i); reintentando"; sleep $((i * 30))
          done
          echo "::error title=Compilación Android fallida::flutter build apk --debug falló 3 veces; revise el registro (dependencias remotas o error de compilación Kotlin/Dart)."
          exit 1
      - name: Imagen de sistema API 34 Google APIs x86_64 (instalación verificada con reintentos acotados)
        # Run 44542445731: el APK compiló, pero la instalación de la imagen dentro de android-emulator-runner falló con
        # «Error on ZipFile unknown archive» (descarga corrupta/incompleta). Se instala ANTES con verificación real del contenido;
        # el runner la encontrará instalada. Misma imagen (API 34, google_apis, x86_64); la QA no cambia.
        run: |
          set -u
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          PAQUETE='system-images;android-34;google_apis;x86_64'
          IMG="$SDK/system-images/android-34/google_apis/x86_64"
          yes | "$SDKM" --licenses > /dev/null || true
          verificar() {
            [ -s "$IMG/system.img" ] && [ -s "$IMG/source.properties" ] && [ -s "$IMG/build.prop" -o -s "$IMG/vendor.img" ] \
              && grep -q 'AndroidVersion.ApiLevel=34' "$IMG/source.properties" && grep -q 'SystemImage.TagId=google_apis' "$IMG/source.properties" \
              && grep -q 'SystemImage.Abi=x86_64' "$IMG/source.properties"
          }
          for i in 1 2 3; do
            if "$SDKM" --install "$PAQUETE" 'emulator' 'platform-tools' && verificar; then
              echo "Imagen verificada (intento $i):"; grep -E 'Pkg.Revision|AndroidVersion.ApiLevel|SystemImage' "$IMG/source.properties"; ls -l "$IMG/system.img"
              exit 0
            fi
            echo "Instalación o verificación de la imagen falló (intento $i); se eliminan solo sus artefactos temporales en el runner efímero."
            rm -rf "$IMG" "$SDK/.temp" "$HOME/.android/cache"
            sleep $((i * 30))
          done
          echo "::error title=Imagen de sistema Android no disponible::No se pudo descargar/verificar $PAQUETE tras 3 intentos (infraestructura de descarga de Google; la QA no se ejecutó)."
          exit 1
      - name: QA en emulador (API 34, x86_64)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./.github/scripts/android_emulador_qa.sh
      - name: Informe, registros sanitizados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-emulador
          path: qa-emulador
          if-no-files-found: warn
          retention-days: 14
