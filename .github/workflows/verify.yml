name: Engineering foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # H-04: integración real contra PostgreSQL/PostGIS EFÍMERO. Cada JVM crea su propio clúster (initdb en un directorio temporal,
  # puerto local, roles y contraseñas aleatorias, sin DB_* ni .env ni bases existentes). No hay credenciales ni destinos externos.
  backend-integration:
    # Fijado: ubuntu-latest migra a Ubuntu 26.04, cuyos repositorios no ofrecen postgresql-16 ni postgresql-16-postgis-3.
    # Ubuntu 24.04 los incluye (PostgreSQL 16 + PostGIS 3.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMW_PG_BIN: /usr/lib/postgresql/16/bin
      GAMW_PG_VERSION_PREFIX: '16.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven Wrapper (descarga verificada por SHA-256, con reintentos)
        working-directory: backend
        run: |
          for i in 1 2 3 4 5; do
            sh ./mvnw --batch-mode -v && exit 0
            echo "Descarga de Maven falló (intento $i); reintentando"; sleep $((i * 20))
          done
          exit 1
      - name: PostgreSQL 16 y PostGIS (solo binarios; el clúster lo crea la prueba)
        run: |
          # H-10: reintento acotado ante HTTP 503 de espejos apt y anotación explícita de infraestructura.
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends postgresql-16 postgresql-16-postgis-3; then
              sudo systemctl stop postgresql || true; exit 0
            fi
            echo "Instalación apt falló (intento $i); reintentando"; sleep $((i * 30))
          done
          echo "::error title=Infraestructura apt no disponible::No se pudieron instalar postgresql-16/postgis desde apt tras 3 intentos; las pruebas no se ejecutaron (no es un fallo de la aplicación)."
          exit 1
      - name: Resolver plugins y dependencias (reintentos acotados ante fallos transitorios del repositorio)
        working-directory: backend
        # Run 44537269267: maven-failsafe-plugin:3.5.6 (versión existente en Maven Central) no se pudo resolver de forma transitoria.
        # Solo descarga; las pruebas NO se omiten: se ejecutan completas en el paso siguiente.
        # Run 44544583001: los reintentos reutilizaban la resolución fallida en caché (*.lastUpdated). -U obliga a reconsultar.
        # Coordenadas explícitas del plugin (versión 3.10.0, la gestionada por el parent): sin resolución de prefijo «dependency:».
        # Solo se reintenta ante errores de descarga/red; cualquier otro error falla de inmediato.
        run: |
          set +e
          for i in 1 2 3; do
            sh ./mvnw --batch-mode --no-transfer-progress -U -Ppostgres-integration \
              -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.requestSentEnabled=true \
              org.apache.maven.plugins:maven-dependency-plugin:3.10.0:resolve-plugins \
              org.apache.maven.plugins:maven-dependency-plugin:3.10.0:resolve > "$RUNNER_TEMP/mvn-resolver.log" 2>&1
            codigo=$?
            [ "$codigo" -eq 0 ] && exit 0
            causa=$(grep -m 5 -E 'could not be resolved|Could not (resolve|transfer)|status code|Connection|timed out|Network is unreachable|Remote host terminated' "$RUNNER_TEMP/mvn-resolver.log" | cut -c1-240 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -z "$causa" ]; then
              tail -n 60 "$RUNNER_TEMP/mvn-resolver.log"
              echo "::error title=Fallo de resolución no relacionado con la red::No se reintenta: revise el registro."
              exit "$codigo"
            fi
            echo "Resolución falló por descarga/red (intento $i)"; echo "$causa" | sed 's/%0A/\n/g'; sleep $((i * 30))
          done
          tail -n 60 "$RUNNER_TEMP/mvn-resolver.log"
          echo "::error title=Repositorio Maven no disponible::No se resolvieron plugins/dependencias tras 3 intentos con -U; las pruebas no se ejecutaron (infraestructura). Causa: ${causa}"
          exit 1
      - name: Integración esencial (Flyway V1–V21, seguridad, cadena operativa, historial, bitácora)
        working-directory: backend
        # El resultado no se altera: falla si falla Maven. Solo se publica una anotación con las líneas de error para diagnóstico.
        run: |
          set +e
          sh ./mvnw --batch-mode --no-transfer-progress -Ppostgres-integration verify \
            -Dit.test=FlywayBaselineIT,IntegridadHistoricaIT,AutorizacionOperativaV19IT,CadenaOperativaFiscalizacionIT,PosicionesGpsIT,EventosEjecucionIT,EjecucionAutenticadaIT,ConsultaSeguimientoGpsIT,JornadasIT,HistorialServicioIT,BitacoraEventosIT,BitacoraAutorizacionIT \
            > "$RUNNER_TEMP/mvn-it.log" 2>&1
          codigo=$?
          tail -n 400 "$RUNNER_TEMP/mvn-it.log"
          if [ "$codigo" -ne 0 ]; then
            # Primera causa raíz: excepciones del arnés y registros de initdb/pg_ctl/postgres del clúster efímero (si se conservaron).
            resumen=$( { grep -nE 'Falló el aprovisionamiento|Se requiere PostgreSQL|Caused by|FATAL|could not|Could not (transfer|resolve)|status code|Permission denied|Tests run:.*FAIL' "$RUNNER_TEMP/mvn-it.log" | head -16
              for f in "${TMPDIR:-/tmp}"/gamw-v8-it-*/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 12 "$f"; }; done; } | cut -c1-260 | head -70 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Fallos de integracion::${resumen}"
          fi
          exit $codigo
      - name: Informes de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven Wrapper (descarga verificada por SHA-256, con reintentos)
        working-directory: backend
        run: |
          for i in 1 2 3 4 5; do
            sh ./mvnw --batch-mode -v && exit 0
            echo "Descarga de Maven falló (intento $i); reintentando"; sleep $((i * 20))
          done
          exit 1
      - name: Backend tests
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress test
      - name: Backend package (tests included)
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress package
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web tests
        working-directory: apps/web
        run: npm test
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Mobile analysis
        working-directory: apps/mobile
        run: flutter analyze
      - name: Mobile tests
        working-directory: apps/mobile
        # El resultado de las pruebas no se altera: el paso falla si falla alguna. Solo se publica un resumen de los fallos como anotación
        # (visible sin descargar logs) para diagnosticar fallos de CI.
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          codigo=$?
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$codigo" -ne 0 ]; then
            resumen=$(grep -nE '\[E\]|EXCEPTION|Expected:|Actual:|Which:|\.dart:[0-9]+|Some tests failed' "$RUNNER_TEMP/flutter-test.log" | head -50 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Fallos de flutter test::${resumen}"
          fi
          exit $codigo
