name: Engineering foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress test
      - name: Backend package (tests included)
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress package
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web tests
        working-directory: apps/web
        run: npm test
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Mobile analysis
        working-directory: apps/mobile
        run: flutter analyze
      - name: Mobile tests
        working-directory: apps/mobile
        run: flutter test
