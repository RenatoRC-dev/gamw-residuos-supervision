name: Engineering foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # H-04: integración real contra PostgreSQL/PostGIS EFÍMERO. Cada JVM crea su propio clúster (initdb en un directorio temporal,
  # puerto local, roles y contraseñas aleatorias, sin DB_* ni .env ni bases existentes). No hay credenciales ni destinos externos.
  backend-integration:
    # Fijado: ubuntu-latest migra a Ubuntu 26.04, cuyos repositorios no ofrecen postgresql-16 ni postgresql-16-postgis-3.
    # Ubuntu 24.04 los incluye (PostgreSQL 16 + PostGIS 3.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMW_PG_BIN: /usr/lib/postgresql/16/bin
      GAMW_PG_VERSION_PREFIX: '16.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Run 44657906261: Maven Central respondió 429 (Too Many Requests) al descargar maven-failsafe-plugin. Este job compartía la clave
      # de caché de setup-java con `verify`, que no usa failsafe y guardaba la caché primero; failsafe se descargaba en cada ejecución.
      # Caché propia del job: tras una ejecución verde, failsafe y sus dependencias quedan en caché y no se piden de nuevo a Central.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-integracion-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          # Run 44659120496: con la caché propia vacía se descargaba TODO y Central volvió a rechazar. Respaldo: la caché ya guardada por
          # setup-java (job verify), de modo que solo falte failsafe; tras una ejecución verde se guarda la clave propia completa.
          restore-keys: |
            m2-integracion-${{ runner.os }}-
            setup-java-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven Wrapper (descarga verificada por SHA-256, con reintentos)
        working-directory: backend
        run: |
          for i in 1 2 3 4 5; do
            sh ./mvnw --batch-mode -v && exit 0
            echo "Descarga de Maven falló (intento $i); reintentando"; sleep $((i * 20))
          done
          exit 1
      - name: PostgreSQL 16 y PostGIS (solo binarios; el clúster lo crea la prueba)
        run: |
          # H-10: reintento acotado ante HTTP 503 de espejos apt y anotación explícita de infraestructura.
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends postgresql-16 postgresql-16-postgis-3; then
              sudo systemctl stop postgresql || true; exit 0
            fi
            echo "Instalación apt falló (intento $i); reintentando"; sleep $((i * 30))
          done
          echo "::error title=Infraestructura apt no disponible::No se pudieron instalar postgresql-16/postgis desde apt tras 3 intentos; las pruebas no se ejecutaron (no es un fallo de la aplicación)."
          exit 1
      - name: Integración esencial (Flyway V1–V21, seguridad, cadena operativa, historial, bitácora)
        working-directory: backend
        # Una aserción funcional fallida nunca se repite. Run 44583215350: se eliminó la pre-resolución con dependency:resolve-plugins
        # (descargaba plugins que este ciclo no usa); -U reconsulta resoluciones remotas fallidas en caché.
        # Runs 44631388307 y 44641349045: maven-failsafe-plugin no se resolvió desde Maven Central ANTES de ejecutar pruebas (la misma
        # versión se resolvió en las ejecuciones previas y posteriores). Reintento acotado (PO): SOLO si el log no contiene ninguna
        # línea «Tests run:» y sí un fallo de descarga remota; cualquier otro fallo termina en el primer intento.
        run: |
          set +e
          descarga='could not be resolved|Could not (resolve|transfer|find artifact)|status code: (4(03|29)|5[0-9][0-9])|Connection (reset|refused|timed out)'
          for intento in 1 2 3; do
            sh ./mvnw --batch-mode --no-transfer-progress -U -Ppostgres-integration verify \
              -Dit.test=FlywayBaselineIT,IntegridadHistoricaIT,AutorizacionOperativaV19IT,CadenaOperativaFiscalizacionIT,PosicionesGpsIT,EventosEjecucionIT,EjecucionAutenticadaIT,ConsultaSeguimientoGpsIT,JornadasIT,HistorialServicioIT,BitacoraEventosIT,BitacoraAutorizacionIT,MinimoPrivilegioEjecucionIT,ConcurrenciaPeriodoJornadaIT,FalloPersistenciaRegistroOperativoIT,IncidenciasOperativasIT,ReportesServicioIT,ReferenciasEspacialesIT,ReclamoInstitucionalIT,RevisionReclamosIT,PuntosCriticosIT,FiscalizacionMunicipalIT,InspeccionCampoIT,InspeccionEvidenciasSinteticasIT,VerificacionCorrectivaIT,*EjecucionNoPropietariaIT \
              > "$RUNNER_TEMP/mvn-it.log" 2>&1
            codigo=$?
            if [ "$codigo" -ne 0 ] && [ "$intento" -lt 3 ] && grep -qE "$descarga" "$RUNNER_TEMP/mvn-it.log" \
               && ! grep -qE 'Tests run: [0-9]+' "$RUNNER_TEMP/mvn-it.log"; then
              echo "::warning title=Descarga Maven remota (intento $intento)::Fallo de descarga antes de ejecutar pruebas; se reintenta."
              grep -m 4 -E "$descarga" "$RUNNER_TEMP/mvn-it.log" | cut -c1-400
              sleep $((intento * 90)); continue   # 429 de Central: ventana de espera mayor (90 s, 180 s)
            fi
            break
          done
          tail -n 400 "$RUNNER_TEMP/mvn-it.log"
          if [ "$codigo" -ne 0 ] && grep -qE "$descarga" "$RUNNER_TEMP/mvn-it.log" \
             && ! grep -qE 'Tests run: [0-9]+' "$RUNNER_TEMP/mvn-it.log"; then
            remoto=$(grep -m 4 -E "$descarga" "$RUNNER_TEMP/mvn-it.log" | cut -c1-500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Repositorio Maven remoto (infraestructura, no la aplicación)::Fallo de descarga antes de ejecutar pruebas, tras 3 intentos.%0A${remoto}"
          elif [ "$codigo" -ne 0 ]; then
            # Primera causa raíz: excepciones del arnés y registros de initdb/pg_ctl/postgres del clúster efímero (si se conservaron).
            resumen=$( { grep -nE 'Falló el aprovisionamiento|Se requiere PostgreSQL|Caused by|FATAL|could not|Could not (transfer|resolve)|status code|Permission denied|Tests run:.*FAIL' "$RUNNER_TEMP/mvn-it.log" | head -16
              for f in "${TMPDIR:-/tmp}"/gamw-v8-it-*/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 12 "$f"; }; done; } | cut -c1-260 | head -70 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Fallos de integracion::${resumen}"
          fi
          exit $codigo
      - name: Informes de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven Wrapper (descarga verificada por SHA-256, con reintentos)
        working-directory: backend
        run: |
          for i in 1 2 3 4 5; do
            sh ./mvnw --batch-mode -v && exit 0
            echo "Descarga de Maven falló (intento $i); reintentando"; sleep $((i * 20))
          done
          exit 1
      - name: Backend tests
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress test
      - name: Backend package (tests included)
        working-directory: backend
        run: sh ./mvnw --batch-mode --no-transfer-progress package
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Web tests
        working-directory: apps/web
        run: npm test
      - name: Web build
        working-directory: apps/web
        run: npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Mobile analysis
        working-directory: apps/mobile
        run: flutter analyze
      - name: Mobile tests
        working-directory: apps/mobile
        # El resultado de las pruebas no se altera: el paso falla si falla alguna. Solo se publica un resumen de los fallos como anotación
        # (visible sin descargar logs) para diagnosticar fallos de CI.
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          codigo=$?
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$codigo" -ne 0 ]; then
            resumen=$(grep -nE '\[E\]|EXCEPTION|Expected:|Actual:|Which:|\.dart:[0-9]+|Some tests failed' "$RUNNER_TEMP/flutter-test.log" | head -50 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Fallos de flutter test::${resumen}"
          fi
          exit $codigo
